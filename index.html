<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=960,H=540,FY=470,G=2000,LEFT=70,RIGHT=890,INK='#1c1712',PAPER='#efe3b9',D=Math.PI/180;
const FF="'Noto Serif TC','Songti TC','PMingLiU','Microsoft JhengHei',serif",rnd=Math.random;

// ---------- 木刻版畫質感：底紙、暗角、圖樣 ----------
const paper=mkc(W,H),vg=mkc(W,H),PAT={};
(()=>{let b=paper.getContext('2d');b.fillStyle='#e6d49b';b.fillRect(0,0,W,H);

b=vg.getContext('2d');const q=b.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.62);q.addColorStop(0,'rgba(60,35,10,0)');q.addColorStop(1,'rgba(60,35,10,.6)');b.fillStyle=q;b.fillRect(0,0,W,H);
b.strokeStyle='rgba(50,30,10,.55)';b.lineWidth=3;b.strokeRect(10,10,W-20,H-20);b.lineWidth=1;b.strokeRect(16,16,W-32,H-32)})();
function mkPat(k){const c=mkc(8,8),b=c.getContext('2d');b.fillStyle=PAPER;b.fillRect(0,0,8,8);b.strokeStyle=INK;b.fillStyle=INK;b.lineWidth=1;b.beginPath();

if(k=='h'){b.moveTo(0,3);b.lineTo(8,3);b.moveTo(0,7);b.lineTo(8,7)}

// ---------- 場景（三關各一幅版畫式背景）----------
function mkBG(n){const c=mkc(W,H),b=c.getContext('2d');b.drawImage(paper,0,0);b.strokeStyle='#2a2118';b.lineCap='round';
const L=(x1,y1,x2,y2,w=1.3)=>{b.lineWidth=w;b.beginPath();b.moveTo(x1,y1);b.lineTo(x2,y2);b.stroke()};
const HT=(x,y,w,h,sp,v,a=.5)=>{b.save();b.beginPath();b.rect(x,y,w,h);b.clip();b.globalAlpha=a;for(let i=0;i<(v?w:h)/sp;i++)v?L(x+i*sp,y,x+i*sp,y+h,.8):L(x,y+i*sp,x+w,y+i*sp,.8);b.restore()};
const AR=(cx,top,w,h,ht)=>{b.beginPath();b.moveTo(cx-w/2,top+h);b.lineTo(cx-w/2,top+w/2);b.arc(cx,top+w/2,w/2,Math.PI,0);b.lineTo(cx+w/2,top+h);b.closePath();b.lineWidth=2.2;b.fillStyle='rgba(40,30,20,.08)';b.fill();b.stroke();if(ht){b.save();b.clip();b.globalAlpha=.5;for(let x=cx-w/2;x<cx+w/2;x+=5)L(x,top,x,top+h,.8);b.restore()}};

b.fillStyle='rgba(120,85,45,.15)';b.fillRect(0,400,W,H-400);L(0,400,W,400,2.4);

else{for(let i=-9;i<=9;i++)L(W/2+i*45,400,W/2+i*170,H,1);[416,436,462,498].forEach(y=>L(0,y,W,y,1));
if(n>=2){const ys=[400,416,436,462,498,H];for(let j=0;j<5;j++)for(let i=-10;i<10;i++)if((i+j)&1){const f=y=>W/2+i*(45+125*(y-400)/(H-400)),h2=y=>W/2+(i+1)*(45+125*(y-400)/(H-400));b.fillStyle='rgba(30,22,15,.2)';b.beginPath();b.moveTo(f(ys[j]),ys[j]);b.lineTo(h2(ys[j]),ys[j]);b.lineTo(h2(ys[j+1]),ys[j+1]);b.lineTo(f(ys[j+1]),ys[j+1]);b.fill()}}}
if(n==0){HT(0,0,W,60,4);for(let i=0;i<4;i++){const x=135+i*230;AR(x,100,110,260,1);L(x,150,x,360,1.5);L(x-55,210,x+55,210,1.5)}for(let i=0;i<5;i++)COL(20+i*230)}
if(n==1){for(let i=0;i<5;i++){const x=80+i*190,y=60+(i%2)*40;b.lineWidth=1.3;b.beginPath();b.arc(x,y,18,3.3,6.2);b.arc(x+28,y-6,24,3.4,6.1);b.arc(x+58,y,16,3.5,6.3);b.stroke();HT(x-10,y-4,80,10,4,0,.3)}
[[20,270],[330,280],[650,270]].forEach(([x,w],k)=>{b.fillStyle='rgba(235,220,170,.96)';b.fillRect(x,230,w,170);b.lineWidth=2.4;b.strokeRect(x,230,w,170);
b.beginPath();b.moveTo(x-12,230);b.lineTo(x+w/2,140+k*12);b.lineTo(x+w+12,230);b.closePath();b.fillStyle='rgba(40,30,20,.18)';b.fill();b.stroke();b.save();b.clip();b.globalAlpha=.5;for(let y=140;y<232;y+=4)L(x-20,y,x+w+20,y,.8);b.restore();
L(x,290,x+w,290,3);L(x,350,x+w,350,3);for(let i=0;i<=4;i++){const xp=x+i*w/4;L(xp,230,xp,400,3);if(i<4){L(xp,290,xp+w/4,350,2.2);L(xp+w/4,230,xp,290,2.2)}}
[x+34,x+w-68].forEach(wx=>{b.fillStyle='rgba(30,25,20,.35)';b.fillRect(wx,243,34,34);b.strokeRect(wx,243,34,34);L(wx+17,243,wx+17,277,1.5)});AR(x+w/2,326,40,74,1)})}
if(n>=2){HT(0,0,W,50,4);for(let i=0;i<3;i++)AR(160+i*320,90,200,310,1);[0,320,640,960].forEach(COL);
L(480,0,480,50,2);b.lineWidth=2.5;b.beginPath();b.ellipse(480,70,80,16,0,0,7);b.stroke();for(let i=-3;i<=3;i++){L(480+i*24,66,480+i*24,50,2);b.beginPath();b.ellipse(480+i*24,44,3,6,0,0,7);b.stroke()}
[150,810].forEach(x=>{b.beginPath();b.moveTo(x-30,110);b.lineTo(x+30,110);b.lineTo(x+30,260);b.lineTo(x,290);b.lineTo(x-30,260);b.closePath();b.fillStyle='rgba(235,220,170,.96)';b.fill();b.lineWidth=2.4;b.stroke();HT(x-30,120,60,150,4,0,.6)})}
if(n==3){b.fillStyle='rgba(40,25,15,.18)';b.fillRect(0,0,W,H)}b.drawImage(vg,0,0);return c}
const BG=[mkBG(0),mkBG(1),mkBG(2),mkBG(3)];
// ---------- 版畫繪圖工具 ----------
function ln(x1,y1,x2,y2,w=3){g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.quadraticCurveTo((x1+x2)/2+Math.sin(x1*.7+y2)*1.2,(y1+y2)/2+Math.cos(y1*.5+x2)*1.2,x2,y2);g.stroke()}
function el(x,y,rx,ry,fill,w=2.4,rot=0){g.beginPath();g.ellipse(x,y,rx,ry,rot,0,7);if(fill){g.fillStyle=fill;g.fill()}g.lineWidth=w;g.stroke()}
const dot=(x,y,r)=>el(x,y,r,r,INK,1);
function seg(a,b,w1,w2,f){const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;g.beginPath();g.moveTo(a[0]+nx*w1/2,a[1]+ny*w1/2);g.lineTo(b[0]+nx*w2/2,b[1]+ny*w2/2);g.lineTo(b[0]-nx*w2/2,b[1]-ny*w2/2);g.lineTo(a[0]-nx*w1/2,a[1]-ny*w1/2);g.closePath();g.fillStyle=PAT[f]||f;g.fill();g.lineWidth=2.6;g.stroke()}
function sword(h,t,k){const dx=t[0]-h[0],dy=t[1]-h[1],l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,nx=-uy,ny=ux,gw=14*k;
g.beginPath();g.moveTo(h[0]+nx*2.6,h[1]+ny*2.6);g.lineTo(t[0],t[1]);g.lineTo(h[0]-nx*2.6,h[1]-ny*2.6);g.closePath();g.fillStyle='#f6f1df';g.fill();g.lineWidth=1.8;g.stroke();
ln(h[0]+ux*6,h[1]+uy*6,t[0]-ux*10,t[1]-uy*10,.9);ln(h[0]-nx*gw,h[1]-ny*gw,h[0]+nx*gw,h[1]+ny*gw,3.4);
ln(h[0],h[1],h[0]-ux*16,h[1]-uy*16,5);g.lineWidth=1.8;g.beginPath();g.moveTo(h[0]+nx*gw,h[1]+ny*gw);g.quadraticCurveTo(h[0]-ux*8+nx*gw*1.4,h[1]-uy*8+ny*gw*1.4,h[0]-ux*16,h[1]-uy*16);g.stroke();el(h[0]-ux*18,h[1]-uy*18,3.6,3.6,INK,1)}
function musket(h,t){const dx=t[0]-h[0],dy=t[1]-h[1],l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l;const b=[h[0]-ux*50,h[1]-uy*50];seg(b,t,8,6,'#3a2c1f');seg([b[0]-ux*44,b[1]-uy*44+12],b,16,9,PAPER);el(h[0]-ux*10,h[1]-uy*10-8,5,5,INK,1);ln(h[0]-ux*10,h[1]-uy*10,h[0]-ux*20,h[1]-uy*20-14,2)}
// ---------- 皮影式關節人偶 ----------
// 姿勢欄位：軀幹傾, 頭傾, 前腿大腿, 前小腿, 後大腿, 後小腿, 上臂, 前臂, 劍角, 後上臂, 後前臂, 身體前移（角度為自下方順時針向前）
const POSE={
idle:[6,0,28,12,-30,-12,62,92,100,-40,-95,0],crouch:[22,0,80,5,-50,-58,40,70,75,-60,-110,0],
blk:[2,0,22,8,-26,-10,55,120,170,-50,-100,0],cblk:[24,0,80,5,-50,-58,30,50,20,-60,-110,0],
stW:[-2,0,18,8,-32,-12,10,85,92,-50,-110,-8],stH:[14,0,42,10,-34,-22,88,92,92,-70,-130,20],
ltW:[18,0,60,5,-45,-50,20,70,80,-70,-120,0],ltH:[38,0,86,2,-56,-56,80,70,62,-90,-140,30],
luW:[10,0,50,10,-35,-20,30,80,90,-80,-130,0],luH:[32,0,82,0,-52,-52,95,92,92,-130,-150,50],
ovW:[-8,0,22,10,-30,-12,170,200,215,-30,-60,-10],ovH:[24,0,52,10,-38,-25,75,80,70,-60,-90,20],
air:[8,0,60,70,10,50,60,92,100,-60,-100,0],dive:[30,0,70,50,-10,40,95,60,42,-100,-120,20],
hurt:[-22,-20,10,0,-40,-20,-20,30,10,-100,-160,-15],gun:[4,0,20,8,-24,-10,80,90,88,55,100,0],dash:[14,0,52,6,-40,-35,70,92,100,-60,-100,10]};
const COS={hero:{d:'o',b:'d',hat:'plume',beard:0},duel:{d:'x',b:'h',hat:'cap',beard:1},dag:{d:'d',b:'x',hat:'wide',beard:2,cloak:1}};
function drawF(f){
const C=COS[f.type],q=f.pose.slice();
if(f.st=='walk'){const s=Math.sin(f.anim*11)*(f.vx*f.face<0?-1:1);q[2]+=s*26;q[4]-=s*26;q[3]+=s*14;q[5]-=s*14}
const r=q.map(v=>v*D),A=a=>[Math.sin(a),Math.cos(a)],V=(p,a,l)=>{const u=A(a);return[p[0]+u[0]*l,p[1]+u[1]*l]};
let fk=V([0,0],r[2],50),ff=V(fk,r[3],50),bk=V([0,0],r[4],50),bf=V(bk,r[5],50);
const gy=Math.max(ff[1],bf[1]),ox=q[11],tr=p=>[p[0]+ox,p[1]-gy];

el(0,0,12,14,PAPER,2.4);g.lineWidth=2;g.beginPath();g.moveTo(10,-2);g.lineTo(18,4);g.lineTo(10,6);g.stroke();dot(5,-3,1.8);ln(1,-8,9,-7,1.8);ln(5,8,15,7,2.4);

else if(C.hat=='cap'){el(0,-15,15,11,PAT.x,2.4);el(0,-6,13,3,PAPER,1.6);ln(8,-24,24,-42,2.6)}
else{el(0,-10,32,6,PAPER,2.6);g.beginPath();g.moveTo(-12,-10);g.lineTo(-11,-30);g.quadraticCurveTo(0,-36,12,-30);g.lineTo(13,-10);g.closePath();g.fillStyle=PAT.s;g.fill();g.lineWidth=2.4;g.stroke();g.lineWidth=3;g.beginPath();g.moveTo(10,-30);g.bezierCurveTo(34,-44,44,-20,40,-2);g.stroke()}
